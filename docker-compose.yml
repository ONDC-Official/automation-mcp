services:
  ondc-mcp:
    build: .
    # Routing is stateless — no sticky sessions needed. But sessions and
    # transactions *are* shared state, so scaling past one replica means
    # pointing REDIS_URL at a Redis all of them can reach. Left unset, each
    # replica keeps its own state in-process and they will not agree with each
    # other; the server logs a warning at boot when that happens in production.
    # Scale with `docker compose up --scale ondc-mcp=3`.
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      HOST: 0.0.0.0
      PORT: 3000
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://127.0.0.1:3000/mcp}
      # Container hostnames differ from the public one; list what clients dial.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1,localhost}
      # env.ts refuses to boot with AUTH_MODE=none when NODE_ENV=production.
      AUTH_MODE: ${AUTH_MODE:-jwt}
      AUTH_API_KEYS: ${AUTH_API_KEYS:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_REQUIRED_SCOPES: ${AUTH_REQUIRED_SCOPES:-mcp}
      # Shared state store. Empty means unset, which keeps state in-process.
      REDIS_URL: ${REDIS_URL:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ondc-mcp}
    ports:
      - "3000:3000"
    restart: unless-stopped
    stop_grace_period: 40s
